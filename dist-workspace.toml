[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax). These are
# the four the issue names; `dist init` also offers aarch64 Linux, which is
# a one-line addition if anyone asks for it.
targets = ["x86_64-pc-windows-msvc", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
# crates.io is published by a job of its own, so either channel can be
# re-run without the other. See .github/workflows/publish-crates-io.yml.
publish-jobs = ["./publish-crates-io"]
